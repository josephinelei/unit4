<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分數應用題動態教學工具 (iPad 增強版)</title>
    <style>
        /* iPad 優化設定 */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            touch-action: manipulation;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 25px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        /* 導航按鈕 */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 12px 18px;
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .nav-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        /* 題目與分數樣式 */
        .question-box {
            background-color: #fef9e7;
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 1.35rem;
            line-height: 2.2;
            margin-bottom: 25px;
            border-left: 6px solid #f59e0b;
            color: #334155;
        }
        .frac-container {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            line-height: 1;
        }
        .frac-whole {
            font-size: 1.25em;
            margin-right: 3px;
        }
        .frac-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85em;
        }
        .frac-num { border-bottom: 2px solid currentColor; padding: 0 3px; margin-bottom: 2px; }
        .frac-den { padding: 0 3px; }

        /* 重點標記樣式 */
        .box-word {
            border: 2px solid #ef4444;
            padding: 2px 6px;
            border-radius: 6px;
            background-color: #fee2e2;
            margin: 0 2px;
            color: #b91c1c;
        }
        .color-word {
            color: #0369a1;
            font-weight: bold;
            background-color: #e0f2fe;
            padding: 2px 6px;
            border-radius: 6px;
            border-bottom: 2px solid #38bdf8;
        }

        /* 操作按鈕 */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            padding: 14px 22px;
            font-size: 1.15rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .btn-read { background-color: #8b5cf6; }
        .btn-hl { background-color: #f97316; }
        .btn-step { background-color: #10b981; }
        .btn-logic { background-color: #475569; }

        /* SVG 畫布區 */
        .canvas-area {
            border: 3px dashed #cbd5e1;
            border-radius: 14px;
            background-color: #f8fafc;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .svg-step { display: none; }
        .svg-step.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 計算思路區 */
        .logic-panel {
            display: none;
            background-color: #ecfdf5;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid #10b981;
            margin-top: 20px;
            font-size: 1.25rem;
            line-height: 1.9;
        }
        .hint-title { color: #059669; font-weight: bold; margin-bottom: 10px; margin-top: 0; }
        .steps-title { color: #0284c7; font-weight: bold; margin-top: 20px; margin-bottom: 10px; display: none; }
        #stepsContent { display: none; }
        
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 分數應用題動態解題教學</h1>
    
    <div class="nav-bar" id="navBar"></div>
    <div class="question-box" id="questionArea"></div>

    <div class="controls">
        <button class="action-btn btn-read" onclick="toggleRead()">🔊 讀題 (播放/暫停)</button>
        <button class="action-btn btn-hl" onclick="toggleHighlight()" id="btnHl">🖍️ 找重點 (按2次)</button>
        <button class="action-btn btn-step" onclick="nextStep()">👣 動態畫圖 (下一步)</button>
        <button class="action-btn btn-logic" onclick="toggleLogic()" id="btnLogic">💡 查看思路 (按2次)</button>
    </div>

    <!-- 畫布：使用 viewBox 確保在 iPad 上自適應縮放 -->
    <div class="canvas-area">
        <svg viewBox="0 0 700 280" width="100%" height="auto" id="svgCanvas" style="max-height: 280px;"></svg>
    </div>

    <div class="logic-panel" id="logicPanel">
        <h3 class="hint-title" id="hintTitle">📌 提示：</h3>
        <div id="hintContent"></div>
        <h3 class="steps-title" id="stepsTitle">📝 詳細解題步驟：</h3>
        <div id="stepsContent"></div>
    </div>
</div>

<script>
    // 輔助函數：生成標準分數 HTML 結構（可用於普通文字與 SVG foreignObject 中）
    function f(w, n, d) {
        let wholeStr = w ? `<span class="frac-whole">${w}</span>` : '';
        return `<span class="frac-container">${wholeStr}<span class="frac-fraction"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span></span>`;
    }

    // 輔助函數：生成 SVG foreignObject 內部完整排版的 DIV
    function svgT(textStr) {
        return `<div xmlns="http://www.w3.org/1999/xhtml" class="flex-center" style="color: inherit; font-weight: bold; font-size: 16px;">${textStr}</div>`;
    }

    // 題庫數據定義
    const problems = [
        {
            id: 1,
            textNormal: `媽媽到超級市場,買了 ${f(2,1,3)} 千克牛扒、 ${f(1,3,4)} 千克豬扒和 ${f(1,2,5)} 千克羊扒。媽媽共買了牛扒和羊扒多少千克？`,
            textHl1: `媽媽到超級市場,買了 ${f(2,1,3)} 千克<span class="box-word">牛扒</span>、 ${f(1,3,4)} 千克豬扒和 ${f(1,2,5)} 千克<span class="box-word">羊扒</span>。媽媽<span class="box-word">共買了</span>牛扒和羊扒多少千克？`,
            textHl2: `媽媽到超級市場,買了 ${f(2,1,3)} 千克<span class="box-word">牛扒</span>、 <span class="color-word">${f(1,3,4)} 千克豬扒 (多餘資料)</span>和 ${f(1,2,5)} 千克<span class="box-word">羊扒</span>。媽媽<span class="box-word">共買了</span>牛扒和羊扒多少千克？`,
            ttsText: "媽媽到超級市場,買了 二又三分之一 千克牛扒、 一又四分之三 千克豬扒和 一又五分之二 千克羊扒。媽媽共買了牛扒和羊扒多少千克？",
            hints: "選取適用的資料列式。不需要考慮豬扒的重量。",
            steps: `媽媽共買了牛扒和羊扒：<br> ${f(2,1,3)} + ${f(1,2,5)}<br> = ${f(2,5,15)} + ${f(1,6,15)}<br> = ${f(3,11,15)} (千克)`,
            svg: [
                `<g class="svg-step"><rect x="50" y="50" width="160" height="35" fill="#3b82f6" rx="6"/><foreignObject x="50" y="50" width="160" height="35" style="color: white;">${svgT(`牛扒 ${f(2,1,3)}`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="220" y="50" width="120" height="35" fill="#ef4444" rx="6"/><foreignObject x="220" y="50" width="120" height="35" style="color: white;">${svgT(`羊扒 ${f(1,2,5)}`)}</foreignObject></g>`,
                `<g class="svg-step"><path d="M50 40 L50 25 L340 25 L340 40" stroke="#334155" stroke-width="2" fill="none"/><foreignObject x="130" y="0" width="130" height="25" style="color: #334155;">${svgT(`共 ? 千克`)}</foreignObject></g>`
            ]
        },
        {
            id: 2,
            textNormal: `爸爸買了 ${f(1,1,3)} 千克香蕉和 500 克草莓。爸爸共買了水果多少千克？`,
            textHl1: `爸爸買了 ${f(1,1,3)} <span class="box-word">千克</span>香蕉和 500 <span class="box-word">克</span>草莓。爸爸<span class="box-word">共買了</span>水果多少<span class="box-word">千克</span>？`,
            textHl2: `爸爸買了 ${f(1,1,3)} <span class="box-word">千克</span>香蕉和 <span class="color-word">500 克 (需換算)</span>草莓。爸爸<span class="box-word">共買了</span>水果多少<span class="box-word">千克</span>？`,
            ttsText: "爸爸買了 一又三分之一 千克香蕉和 500 克草莓。爸爸共買了水果多少千克？",
            hints: "單位要相同，才可相加或相減。(1千克 = 1000克，500克 = 1/2千克)",
            steps: `爸爸共買了水果：<br> ${f(1,1,3)} + ${f('',1,2)}<br> = ${f(1,2,6)} + ${f('',3,6)}<br> = ${f(1,5,6)} (千克)`,
            svg: [
                `<g class="svg-step"><rect x="50" y="80" width="160" height="35" fill="#f59e0b" rx="6"/><foreignObject x="50" y="80" width="160" height="35" style="color: white;">${svgT(`香蕉 ${f(1,1,3)} 千克`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="220" y="80" width="120" height="35" fill="#ef4444" rx="6"/><foreignObject x="220" y="80" width="120" height="35" style="color: white;">${svgT(`草莓 ${f('',1,2)} 千克`)}</foreignObject><text x="230" y="65" fill="#dc2626" font-size="12" font-weight="bold">*(500克換算)*</text></g>`,
                `<g class="svg-step"><path d="M50 70 L50 25 L340 25 L340 70" stroke="#334155" stroke-width="2" fill="none"/><foreignObject x="140" y="0" width="120" height="25" style="color: #334155;">${svgT(`共 ? 千克`)}</foreignObject></g>`
            ]
        },
        {
            id: 3,
            textNormal: `一瓶 2 升裝的果汁,爸爸喝了全瓶的 ${f('',1,3)} ,媽媽喝了全瓶的 ${f('',1,4)} 。餘下的果汁佔全瓶的幾分之幾？`,
            textHl1: `一瓶 2 升裝的果汁,爸爸喝了<span class="box-word">全瓶</span>的 ${f('',1,3)} ,媽媽喝了<span class="box-word">全瓶</span>的 ${f('',1,4)} 。<span class="box-word">餘下的</span>果汁佔<span class="box-word">全瓶的幾分之幾</span>？`,
            textHl2: `<span class="color-word">一瓶 2 升裝 (多餘資料)</span>的果汁,爸爸喝了<span class="box-word">全瓶</span>的 ${f('',1,3)} ,媽媽喝了<span class="box-word">全瓶</span>的 ${f('',1,4)} 。<span class="box-word">餘下的</span>果汁佔<span class="box-word">全瓶的幾分之幾</span>？`,
            ttsText: "一瓶 2 升裝的果汁,爸爸喝了全瓶的三分之一 ,媽媽喝了全瓶的四分之一 。餘下的果汁佔全瓶的幾分之幾？",
            hints: "提示1: 一個整體可用「1」來表示。<br>提示2: 不是問餘下果汁多少升，因此「2升」這資料不適用。",
            steps: `餘下的果汁佔全瓶的：<br> 1 - ${f('',1,3)} - ${f('',1,4)}<br> = ${f('',12,12)} - ${f('',4,12)} - ${f('',3,12)}<br> = ${f('',5,12)}`,
            svg: [
                `<g class="svg-step"><rect x="50" y="80" width="340" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="6"/><foreignObject x="50" y="80" width="340" height="35" style="color: #475569;">${svgT(`整瓶果汁 (看作 1 )`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="50" y="80" width="120" height="35" fill="#3b82f6" rx="6"/><foreignObject x="50" y="80" width="120" height="35" style="color: white;">${svgT(`爸爸 ${f('',1,3)}`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="170" y="80" width="90" height="35" fill="#f59e0b" rx="6"/><foreignObject x="170" y="80" width="90" height="35" style="color: white;">${svgT(`媽媽 ${f('',1,4)}`)}</foreignObject></g>`,
                `<g class="svg-step"><foreignObject x="270" y="80" width="120" height="35" style="color: #dc2626;">${svgT(`餘下 ?`)}</foreignObject></g>`
            ]
        },
        {
            id: 4,
            textNormal: `鉛芯筆一枝售 ${f(8,1,5)} 元,原子筆一枝售 ${f(10,7,10)} 元,日軒要買鉛芯筆及原子筆各一枝,付 20 元紙幣一張,應找回多少元？`,
            textHl1: `鉛芯筆一枝售 ${f(8,1,5)} 元,原子筆一枝售 ${f(10,7,10)} 元,日軒要買<span class="box-word">鉛芯筆及原子筆各一枝</span>,付 <span class="box-word">20 元</span>紙幣一張,<span class="box-word">應找回</span>多少元？`,
            textHl2: `鉛芯筆一枝售 ${f(8,1,5)} 元,原子筆一枝售 ${f(10,7,10)} 元,日軒要買<span class="box-word">鉛芯筆及原子筆各一枝</span>,付 <span class="box-word">20 元</span>紙幣一張,<span class="color-word">應找回 (20元是被減數)</span>多少元？`,
            ttsText: "鉛芯筆一枝售 八又五分之一 元,原子筆一枝售 十又十分之七 元,日軒要買鉛芯筆及原子筆各一枝,付 20 元紙幣一張,應找回多少元？",
            hints: "分析哪個是被減數。應找回多少元表示兩枝筆的總售價應比20元少，因此20元是被減數。",
            steps: `應找回：<br> 20 - ( ${f(8,1,5)} + ${f(10,7,10)} )<br> = 20 - ( ${f(8,2,10)} + ${f(10,7,10)} )<br> = 20 - ${f(18,9,10)}<br> = ${f(1,1,10)} (元)`,
            svg: [
                `<g class="svg-step"><rect x="50" y="30" width="380" height="35" fill="#10b981" rx="6"/><foreignObject x="50" y="30" width="380" height="35" style="color: white;">${svgT(`付出的 20 元`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="50" y="80" width="130" height="35" fill="#f59e0b" rx="6"/><foreignObject x="50" y="80" width="130" height="35" style="color: white;">${svgT(`鉛芯筆 ${f(8,1,5)}`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="185" y="80" width="160" height="35" fill="#ea580c" rx="6"/><foreignObject x="185" y="80" width="160" height="35" style="color: white;">${svgT(`原子筆 ${f(10,7,10)}`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="350" y="80" width="80" height="35" fill="none" stroke="#dc2626" stroke-dasharray="4,4" rx="6"/><foreignObject x="350" y="80" width="80" height="35" style="color: #dc2626;">${svgT(`找回 ?`)}</foreignObject></g>`
            ]
        },
        {
            id: 5,
            textNormal: `雪兒想買一個售價是 ${f(5,4,5)} 元的筆刨和一塊售價是 ${f(4,9,10)} 元的膠擦,但她只有 10 元紙幣一張,她還欠多少元？`,
            textHl1: `雪兒想買一個售價是 ${f(5,4,5)} 元的筆刨和一塊售價是 ${f(4,9,10)} 元的膠擦,但她只有 <span class="box-word">10 元</span>紙幣一張,她<span class="box-word">還欠</span>多少元？`,
            textHl2: `雪兒想買一個售價是 ${f(5,4,5)} 元的筆刨和一塊售價是 ${f(4,9,10)} 元的膠擦,但她只有 <span class="box-word">10 元</span>紙幣一張,她<span class="color-word">還欠 (總售價是被減數)</span>多少元？`,
            ttsText: "雪兒想買一個售價是 五又五分之四 元的筆刨和一塊售價是 四又十分之九 元的膠擦,但她只有 10 元紙幣一張,她還欠多少元？",
            hints: "她還欠多少元表示兩件文具的總售價超過10元，因此兩件文具的總售價是被減數。",
            steps: `她還欠：<br> ${f(5,4,5)} + ${f(4,9,10)} - 10<br> = ${f(5,8,10)} + ${f(4,9,10)} - 10<br> = ${f(10,7,10)} - 10<br> = ${f('',7,10)} (元)`,
            svg: [
                `<g class="svg-step"><rect x="50" y="80" width="220" height="35" fill="#cbd5e1" rx="6"/><foreignObject x="50" y="80" width="220" height="35" style="color: #334155;">${svgT(`只有 10 元`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="50" y="30" width="130" height="35" fill="#8b5cf6" rx="6"/><foreignObject x="50" y="30" width="130" height="35" style="color: white;">${svgT(`筆刨 ${f(5,4,5)}`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="185" y="30" width="140" height="35" fill="#d946ef" rx="6"/><foreignObject x="185" y="30" width="140" height="35" style="color: white;">${svgT(`膠擦 ${f(4,9,10)}`)}</foreignObject></g>`,
                `<g class="svg-step"><line x1="275" y1="97" x2="320" y2="97" stroke="#dc2626" stroke-width="4" stroke-dasharray="6,4"/><foreignObject x="270" y="70" width="60" height="30" style="color: #dc2626;">${svgT(`欠 ?`)}</foreignObject></g>`
            ]
        },
        {
            id: 6,
            textNormal: `花生每包重 ${f(2,1,5)} 千克,瓜子每包重 ${f(1,1,4)} 千克。一包花生與兩包瓜子的重量相差多少千克？`,
            textHl1: `花生每包重 ${f(2,1,5)} 千克,瓜子每包重 ${f(1,1,4)} 千克。<span class="box-word">一包花生</span>與<span class="box-word">兩包瓜子</span>的重量<span class="box-word">相差</span>多少千克？`,
            textHl2: `花生每包重 ${f(2,1,5)} 千克,瓜子每包重 ${f(1,1,4)} 千克。<span class="color-word">一包花生</span>與<span class="color-word">兩包瓜子 (需先算兩包)</span>的重量<span class="box-word">相差</span>多少千克？`,
            ttsText: "花生每包重 二又五分之一 千克,瓜子每包重 一又四分之一 千克。一包花生與兩包瓜子的重量相差多少千克？",
            hints: "分析哪個是被減數。要先計算兩包瓜子共重多少。",
            steps: `兩包瓜子共重： ${f(1,1,4)} + ${f(1,1,4)} = ${f(2,2,4)} = ${f(2,1,2)} (千克)<br>相差：<br> ${f(2,1,2)} - ${f(2,1,5)}<br> = ${f(2,5,10)} - ${f(2,2,10)}<br> = ${f('',3,10)} (千克)`,
            svg: [
                `<g class="svg-step"><rect x="50" y="30" width="220" height="35" fill="#ea580c" rx="6"/><foreignObject x="50" y="30" width="220" height="35" style="color: white;">${svgT(`一包花生 ${f(2,1,5)} 千克`)}</foreignObject></g>`,
                `<g class="svg-step"><rect x="50" y="85" width="130" height="35" fill="#0d9488" rx="6"/><rect x="185" y="85" width="130" height="35" fill="#14b8a6" rx="6"/><foreignObject x="50" y="85" width="265" height="35" style="color: white;">${svgT(`兩包瓜子 ( ${f(1,1,4)} +${f(1,1,4)} )`)}</foreignObject></g>`,
                `<g class="svg-step"><path d="M315 45 L315 110" stroke="#64748b" stroke-dasharray="5,5"/><path d="M270 45 L270 75" stroke="#64748b" stroke-dasharray="5,5"/><foreignObject x="270" y="50" width="80" height="30" style="color: #dc2626;">${svgT(`相差 ?`)}</foreignObject></g>`
            ]
        },
        {
            id: 7,
            textNormal: `雪兒、欣彤和美瑤一起參加了運動會的跳遠比賽。雪兒跳遠的成績比欣彤的多 ${f('',2,5)} 米,美瑤的比雪兒的少 ${f('',1,2)} 米,美瑤跳遠的成績是 ${f(2,1,10)} 米。欣彤跳遠的成績是多少米？`,
            textHl1: `雪兒、欣彤和美瑤一起參加了運動會的跳遠比賽。雪兒跳遠的成績比欣彤的多 ${f('',2,5)} 米,美瑤的比雪兒的少 ${f('',1,2)} 米,<span class="box-word">美瑤</span>跳遠的成績是 ${f(2,1,10)} 米。<span class="box-word">欣彤</span>跳遠的成績是多少米？`,
            textHl2: `雪兒、欣彤和美瑤一起參加了運動會的跳遠比賽。<span class="box-word">雪兒</span>跳遠的成績<span class="color-word">比欣彤的多</span> ${f('',2,5)} 米,<span class="box-word">美瑤</span>的<span class="color-word">比雪兒的少</span> ${f('',1,2)} 米,<span class="box-word">美瑤</span>跳遠的成績是 ${f(2,1,10)} 米。<span class="box-word">欣彤</span>跳遠的成績是多少米？`,
            ttsText: "雪兒、欣彤和美瑤一起參加了運動會的跳遠比賽。雪兒跳遠的成績比欣彤的多 五分之二 米,美瑤的比雪兒的少 二分之一 米,美瑤跳遠的成績是 二又十分之一 米。欣彤跳遠的成績是多少米？",
            hints: "提示1: 可利用線段圖來分析較複雜的應用題。<br>提示2: 要先計算的部分(雪兒的成績)需加上括號或按步驟計算。",
            steps: `雪兒的成績： ${f(2,1,10)} + ${f('',1,2)}<br>欣彤的成績：<br> ( ${f(2,1,10)} + ${f('',1,2)} ) - ${f('',2,5)}<br> = ( ${f(2,1,10)} + ${f('',5,10)} ) - ${f('',4,10)}<br> = ${f(2,6,10)} - ${f('',4,10)}<br> = ${f(2,2,10)} = ${f(2,1,5)} (米)`,
            svg: [
                `<g class="svg-step"><foreignObject x="0" y="30" width="60" height="30" style="color: #334155;">${svgT(`美瑤`)}</foreignObject><rect x="65" y="30" width="180" height="30" fill="#3b82f6" rx="6"/><foreignObject x="255" y="30" width="100" height="30" style="color: #1e3a8a;">${svgT(`${f(2,1,10)} 米`)}</foreignObject></g>`,
                `<g class="svg-step"><foreignObject x="0" y="80" width="60" height="30" style="color: #334155;">${svgT(`雪兒`)}</foreignObject><rect x="65" y="80" width="180" height="30" fill="#8b5cf6" rx="6"/><rect x="250" y="80" width="70" height="30" fill="#ef4444" rx="6"/><foreignObject x="325" y="80" width="160" height="30" style="color: #dc2626;">${svgT(`多 ${f('',1,2)} 米 (比美瑤)`)}</foreignObject></g>`,
                `<g class="svg-step"><foreignObject x="0" y="130" width="60" height="30" style="color: #334155;">${svgT(`欣彤`)}</foreignObject><rect x="65" y="130" width="255" height="30" fill="#10b981" rx="6"/><rect x="325" y="130" width="50" height="30" fill="none" stroke="#ea580c" stroke-dasharray="4,4" rx="6"/><foreignObject x="385" y="130" width="160" height="30" style="color: #ea580c;">${svgT(`少 ${f('',2,5)} 米 (比雪兒)`)}</foreignObject></g>`,
                `<g class="svg-step"><foreignObject x="110" y="175" width="150" height="30" style="color: #059669;">${svgT(`欣彤 = ? 米`)}</foreignObject></g>`
            ]
        }
    ];

    let currentIndex = 0;
    let hlState = 0; // 0:正常, 1:紅框(實體/目標), 2:紅框+藍底(條件/干擾)
    let logicState = 0; // 0:隱藏, 1:僅提示, 2:提示+步驟
    let currentStep = 0;
    
    // 語音全域變數
    let synth = window.speechSynthesis;
    let utterance = null;

    // 初始化
    function init() {
        const navBar = document.getElementById('navBar');
        problems.forEach((p, index) => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = `第 ${p.id} 題`;
            btn.onclick = () => loadProblem(index);
            navBar.appendChild(btn);
        });
        loadProblem(0);
    }

    function loadProblem(index) {
        stopTTS();
        currentIndex = index;
        const p = problems[index];
        
        // 重置狀態
        hlState = 0;
        logicState = 0;
        currentStep = 0;

        document.querySelectorAll('.nav-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
        document.getElementById('questionArea').innerHTML = p.textNormal;
        document.getElementById('svgCanvas').innerHTML = p.svg.join('');
        document.getElementById('logicPanel').style.display = 'none';
        document.getElementById('hintContent').innerHTML = p.hints;
        document.getElementById('stepsContent').innerHTML = p.steps;
    }

    // 重點按鈕邏輯 (3段式)
    function toggleHighlight() {
        hlState = (hlState + 1) % 3;
        const p = problems[currentIndex];
        const qArea = document.getElementById('questionArea');
        if (hlState === 0) qArea.innerHTML = p.textNormal;
        else if (hlState === 1) qArea.innerHTML = p.textHl1;
        else if (hlState === 2) qArea.innerHTML = p.textHl2;
    }

    // 線段圖控制
    function nextStep() {
        const steps = document.querySelectorAll('#svgCanvas .svg-step');
        if (currentStep < steps.length) {
            steps[currentStep].classList.add('active');
            currentStep++;
        } else {
            steps.forEach(s => s.classList.remove('active'));
            currentStep = 0;
        }
    }

    // 思路按鈕邏輯 (3段式)
    function toggleLogic() {
        logicState = (logicState + 1) % 3;
        const panel = document.getElementById('logicPanel');
        const stepTitle = document.getElementById('stepsTitle');
        const stepContent = document.getElementById('stepsContent');

        if (logicState === 0) {
            panel.style.display = 'none';
        } else if (logicState === 1) {
            panel.style.display = 'block';
            stepTitle.style.display = 'none';
            stepContent.style.display = 'none';
        } else if (logicState === 2) {
            panel.style.display = 'block';
            stepTitle.style.display = 'block';
            stepContent.style.display = 'block';
        }
    }

    // 語音控制
    function toggleRead() {
        if (synth.speaking) {
            if (synth.paused) synth.resume();
            else synth.pause();
        } else {
            utterance = new SpeechSynthesisUtterance(problems[currentIndex].ttsText);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }
    }
    
    function stopTTS() {
        if (synth.speaking) synth.cancel();
    }

    window.onload = init;
</script>
